[pytest]
# Configuration pour pytest

# Répertoires de test
testpaths = edupaie/tests

# Patterns de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de sortie
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marqueurs personnalisés
markers =
    slow: Tests lents qui prennent plus de temps
    integration: Tests d'intégration
    unit: Tests unitaires
    ui: Tests d'interface utilisateur

# Couverture de code (si coverage.py est installé)
# addopts = --cov=edupaie --cov-report=html --cov-report=term
